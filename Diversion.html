<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diversión</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background-color: #CBEEF3;
            margin: 0;
            color: #222;
        }
        .contenedor { 
            width: 100%;
            max-width: 1200px;
            height: fit-content;
            margin: auto;
        }
        header { 
            background-color: #880D1E;
            color: white;
            text-align: center;
            padding: 25px;
        }
        .contenido { 
            background-color: white;
            padding: 25px;
            margin-top: 25px;
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .contenido img{
            width: 220px;
            height: 220px;
            object-fit: cover;
            border: 3px solid #F26A8D;
            margin-bottom: 24%;
        }
        .contenido video {
            width: 400px;
            height: 220px;
            object-fit: cover;
            border: 3px solid #F26A8D;
        }
        .video-contenedor {
            width: 400px;
            flex-shrink: 0;
        }
        h2 { 
            color: #880D1E;
         }
        .botones {
            width: 90%;
            max-width: 850px;
            margin: 35px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .buttonPrincipal {
            background-color: #DD2D4A;
            border: none;
            color: white;
            padding: 12px 20px;
            margin: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .buttonPrincipal:hover {
            background-color: #880D1E;
            transform: scale(1.05);
        }

        footer { 
            text-align: center;
            margin-top: 25px; 
            padding: 15px;
            background-color: #F49CBB;
        }
        
        .WhoIsHe {
            background-color: #F49CBB;
            flex: 1;
            margin-bottom: 0%;
            padding: 20px;
            height: 450px;
        }

        .ImageCollage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .ImageCollage img{
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 1px solid #F26A8D;
            display: block;
        }
        .buttonImage {
            width: 120px;
            height: 120px;
            padding: 0;
            border: 2px solid #F26A8D;
            border-radius: 4px;
            background-color: white;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .buttonImage:hover,
        .buttonImage:focus-visible {
            border-color: #880D1E;
            transform: scale(1.05);
        }
        .buttonImage:focus-visible {
            outline: 3px solid #CBEEF3;
            outline-offset: 2px;
        }
        .buttonImage img {
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
        }

        @media (max-width: 650px) {
            .contenido {
                display: block;
                text-align: center;
            }

            .WhoIsHe {
                text-align: left;
                margin: 20px 0;
            }

            .video-contenedor {
                width: 100%;
            }

            .contenido video {
                width: 100%;
            }

        }
    </style>
</head>
<body>
    <header>
        <h1>Diversión</h1>
    </header>

    <div class="contenedor">
        <div class="contenido">
            <img src="kasane-teto-gi.gif" alt="Foto Cantante">
            <div class="WhoIsHe">
                <h2>TETO</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloribus, praesentium eos maxime laborum perferendis aspernatur deserunt officia ratione eum, vel nisi doloremque aperiam, tenetur illo fugit esse reiciendis iusto sit.</p>
            </div>
            <div class="video-contenedor">
                <video src="VideoTetoCancion.mp4" controls></video>
                <div class="ImageCollage">
                    <audio id="tetoAudioCar" src="driving-in-car-teto.mp3" ></audio>
                    <audio id="tetoAudioTeto" src="teto-teto.mp3" ></audio>
                    <audio id="tetoAudio67" src="67-teto.mp3" ></audio>
                    <audio id="tetoAudioKasaneTeto" src="kasane-teto.mp3" ></audio>
                    <audio id="tetoAudioOhNo" src="oh-no-teto.mp3" ></audio>
                    <audio id="tetoAudioWord" src="teto-word-of-the-day.mp3" ></audio>
                    <button type="button" class="buttonImage" onclick="document.getElementById('tetoAudioTeto').play()"><img src="TetoHouse.png" alt="Reproducir Driving in Car"></button>
                    <button type="button" class="buttonImage" onclick="document.getElementById('tetoAudioCar').play()"><img src="videoframe_9561.png" alt="Reproducir Driving in Car"></button>
                    <button type="button" class="buttonImage" onclick="document.getElementById('tetoAudio67').play()"><img src="teto-67.jpg" alt="Reproducir Teto Teto"></button>
                    <button type="button" class="buttonImage" onclick="document.getElementById('tetoAudioKasaneTeto').play()"><img src="tetoGood.png" alt="Reproducir Teto Teto"></button>
                    <button type="button" class="buttonImage" onclick="document.getElementById('tetoAudioOhNo').play()"><img src="tetoScary.png" alt="Reproducir 67 Teto"></button>
                    <button type="button" class="buttonImage" onclick="document.getElementById('tetoAudioWord').play()"><img src="tetoFih.png" alt="Reproducir 67 Teto"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="botones">
        <button class="buttonPrincipal" onclick="window.location.href='Principal.html'">Principal</button>
        <button class="buttonPrincipal" onclick="window.location.href='Ciencia.html'">Ciencia</button>
    </div>

    <footer>
        <p>Página de diversión</p>
    </footer>
</body>
</html>
